<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Przekieruj energię — podgląd ikon</title>
<style>
  :root{
    --ivory:#FAF8F4; --cream:#F4EFE3; --parchment:#E7DFD0; --dark:#1D231F;
    --forest:#2C3B35; --forest-deep:#1E2A25; --gold:#B29355; --gold-light:#C9B27F;
    --gold-pale:#F3E9C8; --muted-light:#B7A787; --hairline:#D9CDA8; --wine:#C27BA0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#15201b;color:var(--ivory);
    font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;padding:48px 24px}
  .wrap{max-width:1040px;margin:0 auto;display:grid;gap:48px}
  h1{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-light);
    font-weight:400;text-align:center;margin:0 0 4px}
  .sub{font-style:italic;color:var(--muted-light);text-align:center;font-size:13px;margin:0}
  .panel{border:1px solid rgba(201,178,127,.18);padding:28px 32px;background:var(--forest-deep)}
  .panel.light{background:var(--cream);color:var(--dark);border-color:rgba(194,123,160,.25)}
  .label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-light);margin:0 0 18px}
  .panel.light .label{color:var(--wine)}

  /* grid of all 15 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 28px}
  .cell{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid rgba(201,178,127,.14);
    background:rgba(44,59,53,.35)}
  .cell svg{color:var(--gold-light)}
  .cell .t{font-size:14px;line-height:1.2;color:var(--ivory)}

  /* widget rows */
  .rows{display:grid;gap:10px}
  .row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid rgba(201,178,127,.18);
    background:rgba(44,59,53,.28);text-align:left}
  .row .t{font-size:14px;color:var(--ivory)}
  .row .d{font-size:11px;font-style:italic;color:rgba(231,223,208,.6);margin-top:2px}
  .row .xp{margin-left:auto;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-light)}
  .row svg{color:var(--gold-light)}
  .gold-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent);
    max-width:240px;margin:0 auto 14px;opacity:.6}

  .light .row{border-color:rgba(194,123,160,.22);background:rgba(194,123,160,.05)}
  .light .row .t{color:var(--dark)}
  .light .row .d{color:rgba(60,60,60,.6)}
  .light .row .xp{color:var(--wine)}
  .light .row svg{color:var(--wine)}
  .light .center{font-style:italic;color:rgba(60,60,60,.55);text-align:center;font-size:12px;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">

  <div>
    <h1>Przekieruj energię — nowy zestaw ikon</h1>
    <p class="sub">spójny motyw rytowniczy · cienka kreska · currentColor</p>
  </div>

  <!-- ALL 15 GLYPHS -->
  <section class="panel">
    <p class="label">Wszystkie 15 ikon</p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- COMPACT VARIANT (dark) -->
  <section class="panel">
    <p class="label">Wariant „compact" (ciemny)</p>
    <div class="gold-rule"></div>
    <p class="sub" style="margin-bottom:16px">— lub przekieruj energię —</p>
    <div class="rows" id="rowsDark"></div>
  </section>

  <!-- FULL VARIANT (light, wine accent) -->
  <section class="panel light">
    <p class="label">Wariant pełny (jasny · akcent wino)</p>
    <div class="rows" id="rowsLight"></div>
    <p class="center">miłość to też relacja z sobą i ze światem.</p>
  </section>

  <!-- CEREMONIA POWROTU -->
  <section class="panel">
    <p class="label">Ceremonia powrotu — zamiast 💧 🌬️ 🔥</p>
    <div class="rows" id="rowsCeremony"></div>
  </section>

</div>

<script>
const G = {
  rq_01:'<rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="M4 7 L12 12.5 L20 7"/>',
  rq_02:'<path d="M7 4 H17"/><path d="M7.5 4 C7.5 9 9.5 11 12 11 C14.5 11 16.5 9 16.5 4"/><path d="M12 11 V19"/><path d="M8.5 19 H15.5"/>',
  rq_03:'<path d="M12 11 V20"/><path d="M12 16 C13.5 15 15.5 15.5 16.5 17 C14.8 17.5 13 17 12 16 Z"/><circle cx="12" cy="7.5" r="3.5"/><path d="M10.5 7.5 a1.5 1.5 0 1 1 3 0"/>',
  rq_04:'<path d="M12 3.5 L13.3 10.7 L20.5 12 L13.3 13.3 L12 20.5 L10.7 13.3 L3.5 12 L10.7 10.7 Z"/>',
  rq_05:'<circle cx="12" cy="8.5" r="5"/><path d="M12 13.5 V20"/><path d="M9.5 20 H14.5"/>',
  rq_06:'<path d="M16.5 4 A8 8 0 1 0 16.5 20 A6.2 6.2 0 1 1 16.5 4 Z"/>',
  rq_07:'<path d="M6.8 4.2 C6 4 5.2 4.4 4.9 5.2 C4 7.8 5.4 12 8.7 15.3 C12 18.6 16.2 20 18.8 19.1 C19.6 18.8 20 18 19.8 17.2 L19 14.3 C18.8 13.6 18.1 13.2 17.4 13.4 L15.3 13.9 C14 12.9 11.1 10 10.1 8.7 L10.6 6.6 C10.8 5.9 10.4 5.2 9.7 5 Z"/>',
  rq_08:'<path d="M7 4 H17"/><path d="M7 20 H17"/><path d="M7.5 4 C7.5 9 12 10.5 12 12 C12 13.5 7.5 15 7.5 20"/><path d="M16.5 4 C16.5 9 12 10.5 12 12 C12 13.5 16.5 15 16.5 20"/>',
  rq_09:'<path d="M9 4 L10.5 6.5 L8.5 9 L9.5 19 H14.5 L15.5 9 L13.5 6.5 L15 4"/><path d="M10.5 6.5 Q12 8 13.5 6.5"/>',
  rq_10:'<path d="M5 19 C5 12 10 5 19 5 C19 14 12 19 5 19 Z"/><path d="M7 17 C11 13 15 9 17 7"/>',
  rq_11:'<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5 L11 11 L9.5 14.5 L13 13 Z"/><circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none"/>',
  rq_12:'<path d="M12 19 C4.5 13.5 4.5 8 8 6.5 C10 5.6 11.4 6.8 12 8 C12.6 6.8 14 5.6 16 6.5 C19.5 8 19.5 13.5 12 19 Z"/>',
  rq_13:'<path d="M9 16 V6 L18 4 V14"/><ellipse cx="7" cy="16" rx="2" ry="1.6"/><ellipse cx="16" cy="14" rx="2" ry="1.6"/>',
  rq_14:'<path d="M12 12 C8.5 8.5 4.5 8.5 4.5 12 C4.5 15.5 8.5 15.5 12 12 Z"/><path d="M12 12 C15.5 8.5 19.5 8.5 19.5 12 C19.5 15.5 15.5 15.5 12 12 Z"/><path d="M11 13 L8.5 19"/><path d="M13 13 L15.5 19"/><circle cx="12" cy="12" r="1.2"/>',
  rq_15:'<path d="M5 19 C8 13 13 7 19 5 C18 11 14 16 8 17 Z"/><path d="M8 17 C10 13 13 10 16 8"/><path d="M5 19 L7.5 16.5"/>',
};
const Q = [
  ['rq_01','Napisz do przyjaciółki','Do kogoś, z kim dawno nie gadałaś. Jedno zdanie wystarczy.',30],
  ['rq_02','Zarezerwuj stolik','Sama lub z kimś. Miejsce, gdzie chcesz być widoczna i dobrze ubrana.',40],
  ['rq_03','Kup coś małego tylko dla siebie','Kwiatek, świeczka, kawa w ładnym miejscu.',30],
  ['rq_04','Idź tam, gdzie się dobrze ubierasz','Muzeum, galeria, kawiarnia. Nie pijamas, nie kanapa.',35],
  ['rq_05','Napisz sobie komplementa','Trzy rzeczy, które lubisz w sobie dzisiaj.',25],
  ['rq_06','Zrób coś tylko dla przyjemności','Serial, kąpiel, zapach, muzyka. Po prostu przyjemność.',25],
  ['rq_07','Zadzwoń do kogoś bliskiego','Nie wiadomość — głos. Mama, siostra, przyjaciółka.',35],
  ['rq_08','Zaplanuj coś na siebie','Fryzjer, masaż, obiad. Coś czego możesz się jutro nie doczekać.',30],
  ['rq_09','Ubierz się tak jak lubisz','Tak jak czujesz, że wyglądasz dobrze. Nawet w domu.',20],
  ['rq_10','Wyjdź na spacer bez telefonu','Albo z muzyką, której on nie zna. Twój rytm.',30],
  ['rq_11','Zrób coś po raz pierwszy','Nowa kawiarnia, nowa trasa, nowy przepis.',40],
  ['rq_12','Wyślij komuś miłą wiadomość','Komuś kto na to zasługuje i się nie spodziewa.',25],
  ['rq_13','Stwórz playlistę na ten nastrój','Muzykę, która mówi co czujesz — ale prowadzi gdzie chcesz.',20],
  ['rq_14','Zamów coś co lubisz','Jedzenie, kwiatek, książkę. Mały gest troski.',25],
  ['rq_15','Napisz list do przyszłej siebie','Co czujesz teraz i czego chcesz dla siebie za rok.',35],
];
const svg = (id,size)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">${G[id]}</svg>`;

document.getElementById('grid').innerHTML = Q.map(([id,t])=>
  `<div class="cell">${svg(id,24)}<span class="t">${t}</span></div>`).join('');

const rowsHTML = list => list.map(([id,t,d,xp])=>
  `<div class="row">${svg(id,20)}<div><div class="t">${t}</div><div class="d">${d}</div></div><span class="xp">+ ${xp} XP</span></div>`).join('');

document.getElementById('rowsDark').innerHTML = rowsHTML(Q.slice(0,4));
document.getElementById('rowsLight').innerHTML = rowsHTML(Q.slice(4,8));

// Ceremonia powrotu — glify spójne z RedirectGlyph / Diamond
const CG = {
  woda:'<path d="M12 3.5 C12 3.5 6 10 6 14.5 A6 6 0 0 0 18 14.5 C18 10 12 3.5 12 3.5 Z"/>',
  oddech:'<path d="M4 7.5 C9 5.5 13 9.5 18 7.5"/><path d="M4 12 C9 10 13 14 18 12"/><path d="M4 16.5 C9 14.5 13 18.5 18 16.5"/>',
  iskra:'<path d="M12 3.5 C12.5 7 16 8 15.5 12 C17 11.5 17.5 10 17.5 10 C18.5 12.5 19 14 19 15.5 A7 7 0 0 1 5 15.5 C5 12.5 8 11 9 7.5 C9.5 9.5 11 9.5 11.5 8 C12 6.5 11 5 12 3.5 Z"/>',
};
const csvg = (id,size)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">${CG[id]}</svg>`;
const CERE = [
  ['woda','Wypiłam szklankę wody','1 min'],
  ['oddech','Trzy głębokie oddechy — teraz, zanim pójdziesz dalej','2 min'],
  ['iskra','Jeden element rutyny porannej — cokolwiek, teraz','5 min'],
];
document.getElementById('rowsCeremony').innerHTML = CERE.map(([id,t,time])=>
  `<div class="row">${csvg(id,18)}<div><div class="t">${t}</div></div><span class="xp">${time}</span></div>`).join('');
</script>
</body>
</html>
