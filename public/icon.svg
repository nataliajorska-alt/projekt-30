<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Tło: ciemna zieleń (forest) -->
  <rect width="512" height="512" fill="#2C3B35"/>

  <!-- Dyskretna złota ramka — old money signet feel -->
  <rect x="28" y="28" width="456" height="456" fill="none"
        stroke="#B8963E" stroke-width="1.5" opacity="0.55"/>
  <rect x="36" y="36" width="440" height="440" fill="none"
        stroke="#B8963E" stroke-width="0.8" opacity="0.4"/>

  <!-- Monogram N — italic serif -->
  <text x="256" y="372"
        font-family="Didot, 'Playfair Display', Bodoni, 'Big Caslon', 'Hoefler Text', serif"
        font-style="italic"
        font-weight="500"
        font-size="400"
        fill="#B8963E"
        text-anchor="middle"
        letter-spacing="0">N</text>
</svg>
